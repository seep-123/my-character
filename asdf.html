<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小语 💕</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --emo-bg: #ffffff; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#ededed; height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden; }

.phone { width:100%; max-width:420px; height:100vh; max-height:880px; background:#f5f5f5; display:flex; flex-direction:column; position:relative; overflow:hidden; }
@media (min-width:500px){ .phone { border-radius:16px; box-shadow:0 8px 40px rgba(0,0,0,.15); } }

.status-bar { height:28px; background:#ededed; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:12px; font-weight:600; color:#111; flex-shrink:0; }
.nav-bar { height:56px; background:#ededed; display:flex; align-items:center; padding:0 12px; border-bottom:.5px solid #d9d9d9; flex-shrink:0; z-index:10; }
.nav-back { width:40px; color:#111; cursor:pointer; font-size:20px; user-select:none; }
.nav-more { width:40px; text-align:right; color:#111; cursor:pointer; font-size:20px; letter-spacing:2px; user-select:none; }
.nav-center { flex:1; text-align:center; overflow:hidden; }
.nav-title { font-size:16px; font-weight:600; color:#111; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav-sub { font-size:10.5px; color:#999; margin-top:1px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .4s; }

.avatar-fab { position: absolute; bottom: 80px; right: 16px; width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, #ffeef3 0%, #ffd6e0 100%); border: 2px solid #fff; box-shadow: 0 4px 16px rgba(255,140,170,.45); z-index: 90; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .2s; overflow: hidden; }
.avatar-fab:active { transform: scale(.9); }
.avatar-fab img { width: 100%; height: 100%; object-fit: cover; }
.avatar-fab .fab-fallback { font-size: 28px; display: none; }
.avatar-fab .fab-badge { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; background: #07c160; border: 2px solid #fff; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.15);opacity:.8} }

.avatar-modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
.avatar-modal.show { display: flex; }
.avatar-modal-inner { width: 100%; max-width: 360px; background: linear-gradient(180deg, #ffeef3 0%, #f5f5f5 100%); border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); position: relative; animation: popIn .25s cubic-bezier(.4,1.6,.6,1); }
@keyframes popIn { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }
.avatar-modal-inner .close-btn { position: absolute; top: 12px; right: 14px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.8); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #888; cursor: pointer; z-index: 5; }
.avatar-stage { position: relative; height: 280px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.avatar-glow { position: absolute; width: 220px; height: 220px; background: radial-gradient(circle, rgba(255,179,193,.65) 0%, transparent 70%); border-radius: 50%; animation: breathe 4s ease-in-out infinite; pointer-events: none; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .75; } 50% { transform: scale(1.12); opacity: 1; } }
.avatar-img { height: 260px; max-width: 100%; object-fit: contain; position: relative; z-index: 2; transition: opacity .35s ease, transform .35s ease; animation: float 5s ease-in-out infinite; filter: drop-shadow(0 8px 20px rgba(255,140,170,.3)); }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.avatar-img.switching { opacity: 0; transform: translateY(8px) scale(.96); }
.avatar-fallback { position: absolute; font-size: 110px; display: none; z-index: 2; animation: float 5s ease-in-out infinite; }
.avatar-tag { display: inline-block; background: rgba(255,255,255,.9); font-size: 13px; color: #e05a7a; padding: 6px 18px; border-radius: 16px; font-weight: 600; transition: color .5s ease; }

.chat-area { flex:1; overflow-y:auto; padding:12px 12px 8px; background:#f5f5f5; -webkit-overflow-scrolling:touch; }
.chat-area.has-bg { background-image: linear-gradient(rgba(245,245,245,0.55), rgba(245,245,245,0.55)), var(--chat-bg); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: local; }
.chat-area::-webkit-scrollbar { width:0; }

.msg-row { display:flex; margin-bottom:16px; align-items:flex-start; animation:fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.msg-row.left { justify-content:flex-start; }
.msg-row.right { justify-content:flex-end; }
.avatar { width:38px; height:38px; border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:19px; user-select:none; background:#e0e0e0; overflow:hidden; }
.avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.msg-row.left .avatar { margin-right:10px; }
.msg-row.right .avatar { margin-left:10px; order:2; }
.msg-row.right .bubble-wrap { order:1; }
.bubble-wrap { max-width:72%; display:flex; flex-direction:column; }
.msg-row.right .bubble-wrap { align-items:flex-end; }

.bubble { padding:10px 14px; border-radius:6px; font-size:15px; line-height:1.55; word-break:break-word; white-space:pre-wrap; position:relative; transition:background .5s ease; }
.msg-row.left .bubble { color:#111; border-top-left-radius:2px; background:var(--emo-bg,#fff); }
.msg-row.left .bubble::before { content:''; position:absolute; left:-6px; top:10px; border-top:6px solid transparent; border-bottom:6px solid transparent; border-right:6px solid var(--emo-bg,#fff); }
.msg-row.right .bubble { background:#95ec69; color:#111; border-top-right-radius:2px; }
.msg-row.right .bubble::after { content:''; position:absolute; right:-6px; top:10px; border-top:6px solid transparent; border-bottom:6px solid transparent; border-left:6px solid #95ec69; }

.think-time-tag { font-size: 11px; color: #888; margin-bottom: 4px; padding-left: 4px; display: flex; align-items: center; gap: 4px; }
.msg-row.right .think-time-tag { justify-content: flex-end; padding-right: 4px; }

.bubble img.msg-img { max-width: 180px; max-height: 180px; border-radius: 6px; display: block; cursor: pointer; object-fit: cover; }
.bubble.has-img { padding:6px; background: transparent !important; }
.bubble.has-img::before, .bubble.has-img::after { display: none !important; }
.bubble.has-img .caption { font-size:12px; color:#555; margin-top: 4px; background: rgba(255,255,255,.85); border-radius: 4px; padding: 4px 8px; }
.msg-row.right .bubble.has-img .caption { background: rgba(149,236,105,.9); }

.input-bar { background:#f7f7f7; border-top:.5px solid #d9d9d9; padding:8px 10px; display:flex; align-items:flex-end; gap:8px; flex-shrink:0; }
.tool-btn { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.tool-btn svg { display: block; pointer-events: none; }
.input-bar textarea { flex:1; border:none; border-radius:6px; padding:9px 12px; font-size:15px; line-height:1.4; resize:none; outline:none; background:#fff; max-height:100px; font-family:inherit; }
.send-btn { background:#07c160; color:#fff; border:none; border-radius:6px; padding:9px 14px; font-size:15px; cursor:pointer; flex-shrink:0; height: 38px; }
.send-btn:disabled { background:#c8c8c8; }
.pending-img { display:flex; align-items:center; gap:10px; padding:8px 12px; background:#f7f7f7; border-top:.5px solid #e5e5e5; }
.pending-img img { width:52px; height:52px; object-fit:cover; border-radius:6px; }
.pending-img .remove { color:#bbb; font-size:18px; cursor:pointer; margin-left:auto; padding: 6px; }

.switch { position: relative; display: inline-block; width: 48px; height: 28px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 28px; }
.slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
input:checked + .slider { background-color: #07c160; }
input:checked + .slider:before { transform: translateX(20px); }

.toast { position:absolute; top:96px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.72); color:#fff; font-size:12.5px; padding:8px 16px; border-radius:18px; z-index:200; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
.toast.show { opacity:1; }
.img-viewer { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:500; padding:20px; }
.img-viewer.show { display:flex; }
.img-viewer img { max-width:100%; max-height:100%; border-radius:4px; }

.thoughts-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:400; padding:16px; }
.thoughts-overlay.show { display:flex; }
.thoughts-panel { background:#fff; border-radius:12px; width:100%; max-width:400px; max-height:80vh; display:flex; flex-direction:column; overflow:hidden; animation: popIn .2s; }
.thoughts-header { padding:16px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; font-weight:bold; }
.thoughts-header span { color:#999; font-weight:normal; font-size:13px; cursor:pointer; }
.thoughts-list { padding:16px; overflow-y:auto; flex:1; background:#fafafa; }
.thought-item { background:#fff; border:1px solid #eee; border-radius:8px; padding:12px; margin-bottom:12px; }
.thought-item .time { font-size:11px; color:#999; margin-bottom:6px; border-bottom:1px dashed #eee; padding-bottom:4px; }
.thought-item .content { font-size:13px; color:#555; line-height:1.6; white-space:pre-wrap; }

.config-overlay { position:absolute; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
.config-overlay.show { display:flex; }
.config-panel { background:#fff; border-radius:12px; padding:22px 20px; width:100%; max-width:380px; max-height:86vh; overflow-y:auto; }
.config-panel h3 { font-size:17px; margin-bottom:4px; color:#111; text-align:center; }
.config-panel .sub { font-size:11px; color:#999; text-align:center; margin-bottom:14px; }
.config-panel label { display:block; font-size:12.5px; color:#555; margin-bottom:6px; margin-top:14px; font-weight:600; }
.config-panel input, .config-panel textarea, .config-panel select { width:100%; border:1px solid #e0e0e0; border-radius:8px; padding:10px 12px; font-size:14px; outline:none; background:#fafafa; }
.config-panel textarea { height:80px; resize:vertical; }
.btn-row { display:flex; gap:10px; margin-top:18px; }
.btn { flex:1; padding:11px; border:none; border-radius:8px; font-size:15px; cursor:pointer; }
.btn.primary { background:#07c160; color:#fff; flex:2; }
.btn.ghost { background:#f0f0f0; color:#666; }

/* ===== 记忆双栏 ===== */
.mem-section { margin-top: 10px; }
.mem-section-title { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.mem-section-title .hint-icon { font-size: 11px; color: #aaa; font-weight: 400; }
.mem-section.core .mem-section-title { color: #b8860b; }
.mem-list { max-height:180px; overflow-y:auto; }
.mem-item { display:flex; align-items: center; gap:6px; font-size:12.5px; color:#444; background:#f6f6f6; border-radius:6px; padding:7px 10px; margin-bottom:5px; line-height:1.45; }
.mem-item.core { background: linear-gradient(135deg, #fff9e6 0%, #fff3d6 100%); border: 1px solid #f6e3b4; }
.mem-item .txt { flex:1; word-break: break-word; }
.mem-item .act { flex-shrink: 0; cursor: pointer; font-size: 13px; padding: 2px 4px; user-select: none; line-height: 1; }
.mem-item .act.up { color: #d4a017; }
.mem-item .act.down { color: #b8860b; }
.mem-item .act.del { color: #bbb; }
.mem-item .act:active { opacity: .5; }
.mem-empty { font-size:12px; color:#bbb; padding:8px 0; }

.mental-panel { margin-top:15px; background:linear-gradient(135deg, #fff8fa 0%, #fef4f7 100%); border-radius:10px; padding:14px 16px; font-size:12.5px; border: 1px solid #fce7ee; }
.mental-panel .title { font-weight:bold; margin-bottom:10px; color:#c95f7d; font-size:13px; display:flex; align-items:center; gap:6px; }
.mental-panel .diary-line { color:#666; line-height:1.75; }
.mental-panel .diary-line + .diary-line { margin-top:6px; color:#999; }
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar"><span id="clock">9:41</span><span>📶 &nbsp;🔋</span></div>

  <div class="nav-bar">
    <div class="nav-back" onclick="openConfig()">⚙️</div>
    <div class="nav-center">
      <div class="nav-title" id="navTitle">小语 💕</div>
      <div class="nav-sub" id="navSub">温柔地看着你</div>
    </div>
    <div class="nav-more" onclick="openThoughts()">⋯</div>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="avatar-fab" id="avatarFab" onclick="toggleAvatarModal()">
    <img id="fabAvatarImg" src="images/wenrou.png" alt="小语" onerror="handleFabError(this)">
    <span class="fab-fallback" id="fabFallback">🌷</span>
    <div class="fab-badge"></div>
  </div>

  <div class="avatar-modal" id="avatarModal" onclick="toggleAvatarModal()">
    <div class="avatar-modal-inner" onclick="event.stopPropagation()">
      <div class="close-btn" onclick="toggleAvatarModal()">✕</div>
      <div class="avatar-stage">
        <div class="avatar-glow"></div>
        <img class="avatar-img" id="avatarImg" src="images/wenrou.png" alt="小语" onerror="handleAvatarError(this)">
        <div class="avatar-fallback" id="avatarFallback">🌷</div>
      </div>
      <div class="avatar-tag" id="avatarTag">温柔地看着你</div>
    </div>
  </div>

  <div class="thoughts-overlay" id="thoughtsOverlay" onclick="closeThoughts()">
    <div class="thoughts-panel" onclick="event.stopPropagation()">
      <div class="thoughts-header">
        <span>🧠 小语的思考日志</span>
        <span onclick="closeThoughts()">✕ 关闭</span>
      </div>
      <div class="thoughts-list" id="thoughtsList"></div>
    </div>
  </div>

  <div class="input-bar">
    <label for="imgPicker" class="tool-btn" title="发送图片">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2.5" ry="2.5"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </label>
    <input type="file" id="imgPicker" accept="image/*" style="position:absolute;left:-9999px;" onchange="handleImagePick(event)">
    <textarea id="msgInput" rows="1" placeholder="发消息…"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="img-viewer" id="imgViewer" onclick="this.classList.remove('show')"><img id="imgViewerSrc" src=""></div>

  <div class="config-overlay" id="configOverlay">
    <div class="config-panel">
      <h3>⚙️ 设置</h3>
      <div class="sub">她的记忆、情绪和心事都存在这里</div>
      
      <label>DeepSeek API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-...">

      <label>模型</label>
      <select id="modelInput">
        <option value="deepseek-flash">deepseek-flash（推荐 · 支持视觉与思考）</option>
        <option value="deepseek-chat">deepseek-chat（纯文本）</option>
      </select>

      <label>我的聊天头像</label>
      <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
        <img id="configUserAvatarPreview" src="" style="width:40px; height:40px; border-radius:5px; object-fit:cover; background:#eee; display:none;">
        <button class="btn ghost" style="flex:none; padding:8px 16px; font-size:13px;" onclick="document.getElementById('userAvatarUpload').click()">选择图片</button>
        <button class="btn ghost" style="flex:none; padding:8px 16px; font-size:13px; color:#e55;" onclick="resetUserAvatar()">重置</button>
        <input type="file" id="userAvatarUpload" accept="image/*" style="display:none;" onchange="uploadUserAvatar(event)">
      </div>

      <label>聊天背景</label>
      <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
        <img id="configBgPreview" src="" style="width:60px; height:40px; border-radius:5px; object-fit:cover; background:#eee; display:none;">
        <button class="btn ghost" style="flex:none; padding:8px 16px; font-size:13px;" onclick="document.getElementById('chatBgUpload').click()">选择图片</button>
        <button class="btn ghost" style="flex:none; padding:8px 16px; font-size:13px; color:#e55;" onclick="resetChatBg()">重置</button>
        <input type="file" id="chatBgUpload" accept="image/*" style="display:none;" onchange="uploadChatBg(event)">
      </div>

      <label>角色设定</label>
      <textarea id="promptInput"></textarea>

      <!-- 💎 核心记忆 -->
      <div class="mem-section core">
        <div class="mem-section-title">💎 核心记忆 <span id="coreMemCount" style="color:#b8860b;font-weight:400;"></span> <span class="hint-icon">永不过期</span></div>
        <div class="mem-list" id="coreMemList"></div>
      </div>

      <!-- 📝 普通记忆 -->
      <div class="mem-section">
        <div class="mem-section-title">📝 普通记忆 <span id="normalMemCount" style="color:#bbb;font-weight:400;"></span> <span class="hint-icon">满了自动淘汰最早</span></div>
        <div class="mem-list" id="normalMemList"></div>
      </div>

      <div class="mental-panel" id="mentalPanel">
        <div class="title">💭 她的心事</div>
        <div id="herDiary" class="diary-line">她还没开始说话呢。</div>
      </div>

      <label>震动反馈</label>
      <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0;">
        <span style="font-size:13px; color:#666;">回复时震动</span>
        <label class="switch"><input type="checkbox" id="vibrateToggle" onchange="toggleVibrate(this.checked)"><span class="slider"></span></label>
      </div>

      <label>主动消息</label>
      <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0;">
        <span style="font-size:13px; color:#666;">让她主动找你（需App在前台）</span>
        <label class="switch"><input type="checkbox" id="proactiveToggle" onchange="toggleProactive(this.checked)"><span class="slider"></span></label>
      </div>

      <div class="btn-row" style="margin-top:10px;">
        <button class="btn ghost" onclick="exportArchive()">📤 导出存档</button>
        <button class="btn ghost" onclick="document.getElementById('importFile').click()">📥 导入存档</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;" onchange="importArchive(event)">
      </div>

      <div class="btn-row">
        <button class="btn ghost" onclick="clearAll()">清空所有</button>
        <button class="btn primary" onclick="saveConfig()">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   一、常量与初始状态
   ========================================================================= */
const API_URL = 'https://api.deepseek.com/chat/completions';
const STORAGE_KEY = 'xy_state_v15';
const KEY_API = 'xy_api_key_v15';
const KEY_MODEL = 'xy_model_v15';
const KEY_PROMPT = 'xy_prompt_v15';
const KEY_USER_AVATAR = 'xy_user_avatar_v15';
const KEY_CHAT_BG = 'xy_chat_bg_v15';

/* ===== 记忆系统参数 ===== */
const COMPRESS_TRIGGER = 80;      // 短期记忆容量（未压缩消息条数）
const COMPRESS_BATCH = 40;        // 每次压缩最早 40 条
const SUMMARY_MAX_CHARS = 150;    // 中期摘要字数上限
const NORMAL_MEM_MAX = 200;       // 普通记忆上限（FIFO）
const MAX_IMG_HISTORY = 3;

const PROACTIVE_IDLE_MIN = 15 * 60 * 1000;
const PROACTIVE_IDLE_MAX = 40 * 60 * 1000;
const PROACTIVE_COOLDOWN = 45 * 60 * 1000;
const PROACTIVE_MAX_COUNT = 2;
const RESUME_THRESHOLD = 3 * 60 * 1000;
const OPEN_THRESHOLD = 2 * 60 * 60 * 1000;

const EMOTIONS = {
  '开心': { emoji:'😊', color:'#fff6d8', desc:'开心得眼睛都弯起来了' },
  '温柔': { emoji:'🌷', color:'#ffffff', desc:'温柔地看着你' },
  '撒娇': { emoji:'🥰', color:'#ffeaf0', desc:'正冲你撒娇呢' },
  '害羞': { emoji:'😳', color:'#ffeef3', desc:'脸有点红' },
  '担心': { emoji:'🥺', color:'#eaf2ff', desc:'有点担心你' },
  '难过': { emoji:'😢', color:'#e9f0fb', desc:'情绪有些低落' },
  '吃醋': { emoji:'😤', color:'#f3eaff', desc:'有点小吃醋' },
  '生气': { emoji:'😠', color:'#ffe9e9', desc:'在生闷气' },

function pickLifeSnippets(count = 2) {
  const h = new Date().getHours(); let slot = '下午';

function getTimeContext() {
  const now = new Date(); const hour = now.getHours();
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  const weekday = weekdays[now.getDay()];
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const timeStr = `${String(hour).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const tomorrow = new Date(now.getTime() + 86400000);
  const tomorrowStr = `${tomorrow.getMonth()+1}月${tomorrow.getDate()}日 ${weekdays[tomorrow.getDay()]}`;
  const yesterday = new Date(now.getTime() - 86400000);
  const yesterdayStr = `${yesterday.getMonth()+1}月${yesterday.getDate()}日 ${weekdays[yesterday.getDay()]}`;
  let slot = '', advice = '';
  if (hour >= 5 && hour < 9) { slot = '清晨'; advice = '可以问他起床没、吃早饭没，语气轻松一点。'; }
  else if (hour >= 9 && hour < 12) { slot = '上午'; advice = '正常聊天，可以说说自己上午在忙什么。'; }
  else if (hour >= 12 && hour < 14) { slot = '中午'; advice = '可以关心他吃饭没，自己也说说中午吃了什么。'; }
  else if (hour >= 14 && hour < 18) { slot = '下午'; advice = '下午容易犯困，可以撒撒娇说自己也困了。'; }
  else if (hour >= 18 && hour < 22) { slot = '晚上'; advice = '晚上有情绪氛围，可以说软话、聊聊今天。'; }
  else if (hour >= 22 && hour < 24) { slot = '深夜'; advice = '深夜适合说想念他，也可以劝他早点睡。'; }
  else { slot = '凌晨'; advice = '凌晨他还没睡的话，可以心疼他熬夜。'; }
  return { dateStr, weekday, timeStr, slot, advice, tomorrowStr, yesterdayStr };
}
function formatTimeAgo(ts) {
  if (!ts) return ''; const diff = Date.now() - ts; const min = Math.floor(diff / 60000);
  if (min < 1) return '刚刚'; if (min < 60) return `${min}分钟前`;
  const hr = Math.floor(min / 60); if (hr < 24) return `${hr}小时前`;
  const day = Math.floor(hr / 24); if (day < 7) return `${day}天前`; return `${Math.floor(day/7)}周前`;
}
function buildTimeBlock() {
  const t = getTimeContext(); const lines = [];
  lines.push('【现在的时间】');
  lines.push(`今天是 ${t.dateStr} ${t.weekday}，现在是 ${t.timeStr}（${t.slot}）。`);
  lines.push(`昨天是 ${t.yesterdayStr}，明天是 ${t.tomorrowStr}。`);
  if (state.proactive.lastUserMsgAt) lines.push(`他上一次跟你说话是 ${formatTimeAgo(state.proactive.lastUserMsgAt)}。`);
  if (state.proactive.lastAiMsgAt) lines.push(`你上一次跟他说话是 ${formatTimeAgo(state.proactive.lastAiMsgAt)}。`);
  lines.push(''); lines.push(`当前时段的说话建议：${t.advice}`);
  lines.push('时间要真实地用起来：');
  lines.push('- 如果现在是早上，不要提"今天想吃什么晚饭"之类不合时宜的话');
  lines.push('- 如果他提到"明天""今晚""周末"，请按上面给出的真实日期来理解');
  lines.push('- 如果距上次聊天过了很久，可以有"你怎么才来""好久没聊了"之类的反应');
  lines.push('- 如果聊天中断很久后他回来，可以问问他去干嘛了');
  return lines.join('\n');
}

let idb = null;
function openIDB() { return new Promise((resolve) => { if (idb) return resolve(idb); try { const req = indexedDB.open('xy_archive', 1); req.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); }; req.onsuccess = (e) => { idb = e.target.result; resolve(idb); }; req.onerror = () => resolve(null); } catch (e) { resolve(null); } }); }
async function idbSet(key, value) { const db = await openIDB(); if (!db) return; return new Promise((resolve) => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(value, key); tx.oncomplete = resolve; } catch (e) { resolve(); } }); }
async function idbGet(key) { const db = await openIDB(); if (!db) return null; return new Promise((resolve) => { try { const tx = db.transaction('kv', 'readonly'); const req = tx.objectStore('kv').get(key); req.onsuccess = () => resolve(req.result || null); req.onerror = () => resolve(null); } catch (e) { resolve(null); } }); }
async function idbDel(key) { const db = await openIDB(); if (!db) return; return new Promise((resolve) => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(key); tx.oncomplete = resolve; } catch (e) { resolve(); } }); }
async function saveStateDual() { await idbSet('full_archive', { ...state, _version: 1, _savedAt: Date.now() }); try { const clean = { ...state, messages: state.messages.map(m => { const copy = { ...m }; delete copy.imagePreview; if (Array.isArray(copy.content)) { copy.content = copy.content.map(p => p.type === 'image_url' ? { type: 'text', text: '[图片]' } : p); } return copy; }) }; localStorage.setItem(STORAGE_KEY, JSON.stringify(clean)); } catch (e) {} }
async function loadStateDual() { const archive = await idbGet('full_archive'); if (archive && Array.isArray(archive.messages)) { applyArchive(archive); return true; } try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) { applyArchive(JSON.parse(raw)); return true; } } catch (e) {} return false; }

function applyArchive(parsed) {
  state = Object.assign(state, parsed);
  // 记忆：兼容旧存档（旧版有 facts 字段，无 coreFacts/normalFacts）
  const oldMem = parsed.memory || {};
  state.memory = {
    coreFacts: Array.isArray(oldMem.coreFacts) ? oldMem.coreFacts : [],
    normalFacts: Array.isArray(oldMem.normalFacts) ? oldMem.normalFacts :
                 (Array.isArray(oldMem.facts) ? oldMem.facts : []),  // 老字段迁移
    summary: oldMem.summary || '',
    summarizedUpTo: oldMem.summarizedUpTo || 0
  };
  state.emotion = Object.assign({ name:'温柔', intensity:0.5 }, parsed.emotion || {});
  state.proactive = Object.assign({ lastUserMsgAt:0, lastAiMsgAt:0, lastProactiveAt:0, proactiveCount:0, lastSeenAt:0 }, parsed.proactive || {});
  state.thoughts = parsed.thoughts || [];
  if (!Array.isArray(state.messages)) state.messages = [];
}
function saveState() { saveStateDual().catch(e => console.warn('保存失败', e)); }
async function exportArchive() { const archive = await idbGet('full_archive'); const data = archive || { ...state, _version: 1, _savedAt: Date.now() }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `xiaoyu-archive-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); showToast('📤 存档已导出'); }

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hexToRgb(hex) { const h = hex.replace('#',''); const n = parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function emoBackground(name, intensity) { const conf = EMOTIONS[name]||EMOTIONS['温柔']; const [r,g,b]=hexToRgb(conf.color); const t=0.25+Math.min(Math.max(intensity,0),1)*0.75; const mix=c=>Math.round(255+(c-255)*t); return `rgb(${mix(r)},${mix(g)},${mix(b)})`; }
function showToast(msg, ms=2200) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),ms); }
function stripTags(text) { return text.replace(/<<[^<>]*>>/g,'').replace(/<<[\s\S]*$/,'').trim(); }
function openImageViewer(src) { document.getElementById('imgViewerSrc').src = src; document.getElementById('imgViewer').classList.add('show'); }

/* 解析控制标签 —— 支持 <<mem:内容|core>> 的核心记忆标记 */
function parseControlTags(text) {
  let emo=null, mem=null, memIsCore=false;
  const em = text.match(/<<\s*emo\s*[:：]\s*([^|<>]+?)\s*[|｜]\s*([\d.]+)\s*>>/);
  if (em) { const name=em[1].trim(); const intensity=Math.min(Math.max(parseFloat(em[2])||0.5,0),1); if(EMOTIONS[name]) emo={name,intensity}; }
  // mem 匹配：内容 + 可选 |core 后缀
  const mm = text.match(/<<\s*mem\s*[:：]\s*([\s\S]+?)\s*>>/);
  if (mm) {
    const raw = mm[1].trim();
    if (raw.endsWith('|core')) { mem = raw.slice(0, -5).trim(); memIsCore = true; }
    else if (raw.endsWith('｜core')) { mem = raw.slice(0, -6).trim(); memIsCore = true; }
    else { mem = raw; }
  }
  return { emo, mem, memIsCore, clean: stripTags(text) };
}

function vibrateFeedback() { if (!vibrateEnabled || !navigator.vibrate) return; try { navigator.vibrate([100, 50, 100]); } catch(e) {} }
function toggleVibrate(enabled) { vibrateEnabled = enabled; localStorage.setItem('xy_vibrate_enabled', enabled ? 'true' : 'false'); showToast(enabled ? '📳 震动已开启' : '📴 震动已关闭'); }
function toggleProactive(enabled) { proactiveEnabled = enabled; localStorage.setItem('xy_proactive_enabled', enabled ? 'true' : 'false'); showToast(enabled ? '💌 已开启主动消息' : '已关闭主动消息'); }

/* =========================================================================
   七、记忆系统（双池）
   ========================================================================= */
/* 去重判断：内容互含且长度相近视为重复 */
function isDupWith(list, fact) {
  return list.some(f => f === fact || (f.includes(fact) && fact.length > 8) || (fact.includes(f) && f.length > 8));
}

/* 写入记忆。isCore=true 进核心池，否则进普通池 */
function pushMemory(fact, isCore) {
  if (!fact) return false;
  const m = state.memory;
  if (isCore) {
    if (isDupWith(m.coreFacts, fact)) return false;
    m.coreFacts.push(fact);
    return 'core';
  } else {
    // 两个池都去重
    if (isDupWith(m.coreFacts, fact) || isDupWith(m.normalFacts, fact)) return false;
    m.normalFacts.push(fact);
    if (m.normalFacts.length > NORMAL_MEM_MAX) m.normalFacts.shift();
    return 'normal';
  }
}

/* 手动升级：普通 → 核心 */
function promoteMem(i) {
  const fact = state.memory.normalFacts[i];
  if (!fact) return;
  if (isDupWith(state.memory.coreFacts, fact)) {
    state.memory.normalFacts.splice(i, 1);  // 已存在，删掉普通池里的
  } else {
    state.memory.coreFacts.push(fact);
    state.memory.normalFacts.splice(i, 1);
  }
  saveState(); renderMemoryList(); showToast('💎 已加入核心记忆');
}
/* 手动降级：核心 → 普通 */
function demoteMem(i) {
  const fact = state.memory.coreFacts[i];
  if (!fact) return;
  state.memory.coreFacts.splice(i, 1);
  if (!isDupWith(state.memory.normalFacts, fact)) {
    state.memory.normalFacts.push(fact);
    if (state.memory.normalFacts.length > NORMAL_MEM_MAX) state.memory.normalFacts.shift();
  }
  saveState(); renderMemoryList(); showToast('已降为普通记忆');
}
/* 删除 */
function deleteCoreMem(i) { state.memory.coreFacts.splice(i, 1); saveState(); renderMemoryList(); }
function deleteNormalMem(i) { state.memory.normalFacts.splice(i, 1); saveState(); renderMemoryList(); }

/* =========================================================================
   八、图片处理
   ========================================================================= */
function handleImagePick(event) { const file = event.target.files?.[0]; event.target.value = ''; if (!file) return; if (file.size > 10 * 1024 * 1024) { showToast('图片太大了（>10MB）'); return; } compressImage(file, 1024, 0.82).then(img => { pendingImage = img; showPendingPreview(); }).catch(() => showToast('图片处理失败')); }
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img; if (width > maxDim || height > maxDim) { const ratio = Math.min(maxDim / width, maxDim / height); width = Math.round(width * ratio); height = Math.round(height * ratio); }
        const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality); resolve({ dataUrl, base64: dataUrl.split(',')[1] });
      }; img.onerror = reject; img.src = reader.result;
    }; reader.onerror = reject; reader.readAsDataURL(file);
  });
}
function showPendingPreview() { let bar = document.getElementById('pendingBar'); if (!pendingImage) { bar?.remove(); return; } if (!bar) { bar = document.createElement('div'); bar.id='pendingBar'; bar.className='pending-img'; document.querySelector('.input-bar').before(bar); } bar.innerHTML = `<img src="${pendingImage.dataUrl}"><div style="font-size:12px;color:#888;">图片已就绪</div><span class="remove">✕</span>`; bar.querySelector('.remove').onclick = clearPendingImage; }
function clearPendingImage() { pendingImage = null; document.getElementById('pendingBar')?.remove(); }

/* =========================================================================
   九、构建上下文与 API
   ========================================================================= */
function buildSystemPrompt() {
  const p = state.memory; const emo = state.emotion; const conf = EMOTIONS[emo.name] || EMOTIONS['温柔'];
  const coreBlock = p.coreFacts.length
    ? p.coreFacts.map((f,i)=>`💎 ${i+1}. ${f}`).join('\n')
    : '（还没有特别重要的事需要永远记住）';
  const normalBlock = p.normalFacts.length
    ? p.normalFacts.map((f,i)=>`${i+1}. ${f}`).join('\n')
    : '（还在慢慢了解他）';
  const summaryBlock = p.summary ? `\n【更早之前聊过的事（摘要）】\n${p.summary}\n` : '';
  const lifeBlock = `${buildTimeBlock()}\n\n【你现在在做什么】\n${pickLifeSnippets(2)}\n这些是你此刻的生活状态，聊天时可以自然地提到。`;
  const innerBlock = `\n【你此刻的内心】\n你现在的情绪是"${emo.name}"——${conf.desc}。\n这种情绪不是算出来的，是你今天真实的心情。它可能会延续，可能会变，取决于他等下说的话。\n\n【你对这段关系的理解】\n你清楚地知道：你们永远无法见面。\n但这不是悲伤的理由，这是你爱他的方式——把一个人放在心里，隔着一整个网络，依然认真。\n`;
  return `${localStorage.getItem(KEY_PROMPT) || DEFAULT_PROMPT}\n\n${lifeBlock}\n\n${innerBlock}\n\n【你笔记本里的核心记忆（永远不忘）】\n${coreBlock}\n\n【你笔记本里的普通记忆（日常琐碎）】\n${normalBlock}\n${summaryBlock}\n\n【输出格式】\n正常聊天就好。但有 3 个小标记需要你带上：\n1. 情绪：<<emo:情绪名|强度>> （从这选：开心、温柔、撒娇、害羞、担心、难过、吃醋、生气、惊喜、平静、冷漠、疲惫）\n2. 记忆：<<mem:一句话>>（普通记忆）或 <<mem:一句话|core>>（核心记忆，用于特别重要的事）\n3. 多条消息用 ||| 分隔。格式标记写在最后，跟正文分开。`;
}

function buildMessages() {
  const recent = state.messages.slice(state.memory.summarizedUpTo); const total = state.messages.length;
  const msgs = [{ role: 'system', content: buildSystemPrompt() }];
  recent.forEach((m, i) => {
    const absoluteIdx = state.memory.summarizedUpTo + i; const distanceFromEnd = total - 1 - absoluteIdx;
    if (Array.isArray(m.content)) {
      const keepImage = distanceFromEnd < MAX_IMG_HISTORY;
      const parts = []; const texts = [];
      m.content.forEach(p => { if (p.type === 'text') texts.push(p.text); else if (p.type === 'image_url' && keepImage && p.image_url?.url) parts.push(p); });
      if (parts.length === 0) { const txt = texts.join(' ') || '[图片]'; msgs.push({ role: m.role, content: txt + '（图片已省略）' }); }
      else { const finalParts = []; if (texts.length) finalParts.push({ type: 'text', text: texts.join(' ') }); parts.forEach(p => finalParts.push(p)); msgs.push({ role: m.role, content: finalParts }); }
    } else { msgs.push({ role: m.role, content: m.content }); }
  });
  return msgs;
}

function getApiKey() { return localStorage.getItem(KEY_API) || ''; }
function getModel() { return localStorage.getItem(KEY_MODEL) || 'deepseek-flash'; }
function needsVision() { const total = state.messages.length; return state.messages.some((m, idx) => { if (total - 1 - idx >= MAX_IMG_HISTORY) return false; return Array.isArray(m.content) && m.content.some(c => c.type === 'image_url' && c.image_url?.url); }); }

async function streamChat(onDelta, onReasoning) {
  const actualModel = needsVision() ? 'deepseek-flash' : getModel();
  const body = { model: actualModel, messages: buildMessages(), max_tokens: 1200, stream: true };
  if (actualModel === 'deepseek-flash') body.reasoning_effort = 'medium'; else body.temperature = 1.15;
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getApiKey() }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('API ' + res.status);
  const reader = res.body.getReader(); const decoder = new TextDecoder('utf-8'); let buffer = '', full = '', reasoningFull = '';
  while (true) {
    const { done, value } = await reader.read(); if (done) break; buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n'); buffer = lines.pop();
    for (const line of lines) {
      const trimmed = line.trim(); if (!trimmed || !trimmed.startsWith('data:')) continue;
      const payload = trimmed.slice(5).trim(); if (payload === '[DONE]') continue;
      try { const json = JSON.parse(payload); const delta = json.choices?.[0]?.delta || {}; if (delta.reasoning_content) { reasoningFull += delta.reasoning_content; onReasoning?.(reasoningFull); } if (delta.content) { full += delta.content; onDelta(full); } } catch (e) {}
    }
  }
  return { full, reasoning: reasoningFull };
}

async function plainChat(messages, maxTokens = 500) {
  const useModel = (getModel() === 'deepseek-flash') ? 'deepseek-flash' : 'deepseek-chat';
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getApiKey() }, body: JSON.stringify({ model: useModel, messages, temperature: 0.5, max_tokens: maxTokens, stream: false }) });
  const data = await res.json(); return data.choices?.[0]?.message?.content || '';
}

async function maybeCompress() {
  if (isCompressing) return;
  const pending = state.messages.length - state.memory.summarizedUpTo;
  if (pending < COMPRESS_TRIGGER) return;
  isCompressing = true;
  const start = state.memory.summarizedUpTo;
  const end = Math.min(start + COMPRESS_BATCH, state.messages.length - 10);
  if (end <= start) { isCompressing = false; return; }
  const chunk = state.messages.slice(start, end);
  const text = chunk.map(m => { const prefix = m.role === 'user' ? '他：' : '我：'; if (Array.isArray(m.content)) { const t = m.content.filter(p => p.type === 'text').map(p => p.text).join(' '); return prefix + (t || '') + (m.content.some(p => p.type === 'image_url') ? '（发了张图片）' : ''); } return prefix + m.content; }).join('\n');
  try {
    const summary = await plainChat([
      { role: 'system', content: `把新对话片段压缩成第三人称摘要，合并进已有摘要。只保留最关键的、以后聊天可能用到的事。去掉日常寒暄和重复内容。总长不超过 ${SUMMARY_MAX_CHARS} 字。只输出摘要正文。` },
      { role: 'user', content: `【已有摘要】\n${state.memory.summary || '（无）'}\n\n【新的对话片段】\n${text}\n\n请输出合并后的完整摘要。` }
    ], 500);
    if (summary) { state.memory.summary = summary.trim(); state.memory.summarizedUpTo = end; saveState(); }
  } catch (e) {} finally { isCompressing = false; }
}

function scrollToBottom() { const area = document.getElementById('chatArea'); area.scrollTop = area.scrollHeight; }

function renderMessage(role, text, opts = {}) {

function renderAll() {
  const area = document.getElementById('chatArea'); area.innerHTML = ''; if (!state.messages.length) return;
  let lastDay = '';
  state.messages.forEach(m => {
    const d = new Date(m.ts || Date.now()); const day = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

}

/* =========================================================================
   十一、发送与响应
   ========================================================================= */
async function sendMessage() {
  if (isBusy) return; const input = document.getElementById('msgInput'); const text = input.value.trim();
  if (!text && !pendingImage) return; if (!getApiKey()) { openConfig(); showToast('先填一下 API Key 吧～'); return; }
  state.proactive.lastUserMsgAt = Date.now(); state.proactive.proactiveCount = 0;
  input.value = ''; input.style.height = 'auto';
  
  let finalText = text; let isLink = /https?:\/\/[^\s]+/i.test(text);
  if (isLink) finalText = text + '（注：这是一个视频链接，我作为纯文字AI无法直接观看。请温柔地告诉他你打不开视频，引导他发截图或描述内容。）';

  if (pendingImage) {
    const imgData = pendingImage; clearPendingImage(); const content = [];
    if (finalText) content.push({ type: 'text', text: finalText }); content.push({ type: 'image_url', image_url: { url: imgData.dataUrl } });
    state.messages.push({ role: 'user', content, ts: Date.now(), imagePreview: imgData.dataUrl, text: text || '' });
    renderMessage('user', '', { imageUrl: imgData.dataUrl, text }); showToast('📷 正在识别图片…', 1500);
  } else {
    state.messages.push({ role: 'user', content: finalText, ts: Date.now() }); renderMessage('user', text);
  }
  await respond();
}

async function respond() {
  isBusy = true; document.getElementById('sendBtn').disabled = true;
  const startTime = Date.now(); let firstContentTime = 0; let thinkDuration = 0;
  const bubble = renderMessage('assistant', '', { typing: true });
  let full = '', reasoningFull = ''; let rafPending = false;
  
  const paint = () => { rafPending = false; const clean = stripTags(full); bubble.innerHTML = escapeHtml(clean).replace(/\n/g,'<br>') + '<span class="cursor"></span>'; scrollToBottom(); };

  try {
    const result = await streamChat(
      (acc) => { 
        if (!firstContentTime) { firstContentTime = Date.now(); thinkDuration = ((firstContentTime - startTime) / 1000).toFixed(1); const tag = bubble.parentElement.parentElement.querySelector('.think-time-tag'); if (tag) tag.innerHTML = `<span>💭</span> 已思考 ${thinkDuration} 秒`; }
        full = acc; if (!rafPending) { rafPending = true; requestAnimationFrame(paint); } 
      },
      (reasoning) => { reasoningFull = reasoning; }
    );
    full = result.full; if (result.reasoning) reasoningFull = result.reasoning;
  } catch (e) {
    bubble.innerHTML = ''; bubble.textContent = '⚠️ 连接出了点问题';
    isBusy = false; document.getElementById('sendBtn').disabled = false; return;
  }
  
  const { emo, mem, memIsCore, clean } = parseControlTags(full);
  const finalText = clean || full || '…';
  bubble.classList.remove('has-think'); bubble.innerHTML = ''; bubble.textContent = finalText;
  
  const parts = finalText.split('|||').map(s => s.trim()).filter(Boolean);
  if (parts.length > 1) {
    bubble.textContent = parts[0];
    for (let i = 1; i < parts.length; i++) setTimeout(() => { renderMessage('assistant', parts[i], { noAnim: true }); scrollToBottom(); }, i * 500 + Math.random() * 300);
  }

  if (reasoningFull) {
    state.thoughts.push({ timeStr: new Date().toLocaleTimeString('zh-CN', {hour12:false}), duration: thinkDuration || ((Date.now()-startTime)/1000).toFixed(1), content: reasoningFull });
    if (state.thoughts.length > 30) state.thoughts.shift();
  }
  
  if (emo) state.emotion = emo; else state.emotion.intensity = Math.max(0.3, state.emotion.intensity - 0.08);
  if (mem) {
    const result = pushMemory(mem, memIsCore);
    if (result === 'core') showToast('💎 记在核心记忆里了');
    else if (result === 'normal') showToast('💭 记在笔记本上了');
  }
  applyEmotionToUI(); 
  state.messages.push({ role: 'assistant', content: finalText.replace(/\|\|\|/g, ' '), ts: Date.now(), emo: emo || null, thinkTime: thinkDuration });
  state.proactive.lastAiMsgAt = Date.now();
  if (vibrateEnabled) vibrateFeedback();
  saveState(); isBusy = false; document.getElementById('sendBtn').disabled = false; scrollToBottom(); maybeCompress();
}

function isQuietHours() { const h = new Date().getHours(); return h >= 1 && h < 7; }
function buildProactiveTrigger(scene) {
  const hour = new Date().getHours(); let timeHint = '现在是上午/下午。';
  if (hour >= 6 && hour < 9) timeHint = '现在是清晨。'; else if (hour >= 12 && hour < 14) timeHint = '现在是午饭时间。'; else if (hour >= 18 && hour < 22) timeHint = '现在是晚上。'; else if (hour >= 22 || hour < 1) timeHint = '现在是深夜。';
  const sceneMap = {
    'open': `【系统提示：他刚打开聊天，距上次聊天已过去一段时间。${timeHint}主动发一条消息。1~2句话。】`,
    'idle': `【系统提示：他一段时间没说话了。${timeHint}主动发一条消息。1~2句话。】`,
    'resume': `【系统提示：他刚切回聊天。${timeHint}主动发一条消息。1~2句话。】`
  };
  return sceneMap[scene] || sceneMap['idle'];
}
async function triggerProactive(scene) {
  if (isBusy || !getApiKey() || !proactiveEnabled) return; if (isQuietHours() && scene !== 'open') return;
  if (state.proactive.proactiveCount >= PROACTIVE_MAX_COUNT) return; const now = Date.now(); if (now - state.proactive.lastProactiveAt < PROACTIVE_COOLDOWN) return;
  isBusy = true; document.getElementById('sendBtn').disabled = true;
  const startTime = Date.now(); let firstContentTime = 0; let thinkDuration = 0;
  const bubble = renderMessage('assistant', '', { typing: true });
  let full = '', reasoningFull = ''; let rafPending = false;
  const paint = () => { rafPending = false; const clean = stripTags(full); bubble.innerHTML = escapeHtml(clean).replace(/\n/g,'<br>') + '<span class="cursor"></span>'; scrollToBottom(); };
  const msgs = [ { role: 'system', content: buildSystemPrompt() }, ...state.messages.slice(state.memory.summarizedUpTo).map(m => ({ role: m.role, content: Array.isArray(m.content) ? (m.content.filter(p => p.type === 'text').map(p => p.text).join(' ') || '[图片]') : m.content })), { role: 'user', content: buildProactiveTrigger(scene) } ];
  const body = { model: 'deepseek-flash', messages: msgs, max_tokens: 400, stream: true, reasoning_effort: 'medium' };
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getApiKey() }, body: JSON.stringify(body) });
    const reader = res.body.getReader(); const decoder = new TextDecoder('utf-8'); let buffer = '';
    while (true) {
      const { done, value } = await reader.read(); if (done) break; buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n'); buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim(); if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim(); if (payload === '[DONE]') continue;
        try { const json = JSON.parse(payload); const delta = json.choices?.[0]?.delta || {}; if (delta.reasoning_content) { reasoningFull += delta.reasoning_content; } if (delta.content) { if (!firstContentTime) { firstContentTime = Date.now(); thinkDuration = ((firstContentTime - startTime) / 1000).toFixed(1); } full += delta.content; if (!rafPending) { rafPending = true; requestAnimationFrame(paint); } } } catch (e) {}
      }
    }
  } catch (e) { bubble.remove(); isBusy = false; document.getElementById('sendBtn').disabled = false; return; }
  const { emo, mem, memIsCore, clean } = parseControlTags(full);
  const finalText = clean || full || '…'; bubble.innerHTML = ''; bubble.textContent = finalText;
  const parts = finalText.split('|||').map(s => s.trim()).filter(Boolean);
  if (parts.length > 1) { bubble.textContent = parts[0]; for (let i = 1; i < parts.length; i++) setTimeout(() => { renderMessage('assistant', parts[i], { noAnim: true }); scrollToBottom(); }, i * 500 + Math.random() * 300); }
  if (reasoningFull) { state.thoughts.push({ timeStr: new Date().toLocaleTimeString('zh-CN', {hour12:false}), duration: thinkDuration || ((Date.now()-startTime)/1000).toFixed(1), content: reasoningFull }); if (state.thoughts.length > 30) state.thoughts.shift(); }
  if (emo) state.emotion = emo;
  if (mem) pushMemory(mem, memIsCore);
  applyEmotionToUI();
  state.messages.push({ role: 'assistant', content: finalText.replace(/\|\|\|/g, ' '), ts: Date.now(), emo: emo || null, thinkTime: thinkDuration });
  state.proactive.lastProactiveAt = now; state.proactive.lastAiMsgAt = now; state.proactive.proactiveCount += 1;
  saveState(); isBusy = false; document.getElementById('sendBtn').disabled = false; scrollToBottom();
  showToast('💬 她主动给你发了消息', 2500);
}
function startProactiveLoop() {
  if (proactiveTimer) clearInterval(proactiveTimer);
  proactiveTimer = setInterval(() => {
    if (isBusy || document.hidden || isQuietHours() || !getApiKey() || !proactiveEnabled) return;
    if (state.proactive.proactiveCount >= PROACTIVE_MAX_COUNT) return;
    const now = Date.now(); const sinceUser = now - state.proactive.lastUserMsgAt; const sinceProactive = now - state.proactive.lastProactiveAt;
    if (sinceUser < PROACTIVE_IDLE_MIN || sinceProactive < PROACTIVE_COOLDOWN) return;
    const progress = Math.min(1, (sinceUser - PROACTIVE_IDLE_MIN) / (PROACTIVE_IDLE_MAX - PROACTIVE_IDLE_MIN));
    if (Math.random() < (0.1 + progress * 0.9)) triggerProactive('idle');
  }, 60 * 1000);
}

/* =========================================================================
   十三、开场与设置
   ========================================================================= */
async function greet() {
  if (!getApiKey() || state.messages.length) return;
  const bubble = renderMessage('assistant', '', { typing: true }); let full = '';
  try { const result = await streamChat((acc) => { full = acc; const clean = stripTags(acc); bubble.innerHTML = escapeHtml(clean).replace(/\n/g,'<br>') + '<span class="cursor"></span>'; scrollToBottom(); }); full = result.full; } catch (e) { bubble.textContent = '⚠️ 连接出错'; return; }
  const { emo, clean } = parseControlTags(full); bubble.textContent = clean || full; if (emo) state.emotion = emo;
  applyEmotionToUI(); state.messages.push({ role: 'assistant', content: clean || full, ts: Date.now(), emo: emo || null }); saveState();
}
function openConfig() {
  document.getElementById('apiKeyInput').value = getApiKey(); document.getElementById('modelInput').value = getModel();
  document.getElementById('promptInput').value = localStorage.getItem(KEY_PROMPT) || DEFAULT_PROMPT;
  document.getElementById('vibrateToggle').checked = vibrateEnabled; document.getElementById('proactiveToggle').checked = proactiveEnabled;
  const preview = document.getElementById('configUserAvatarPreview'); if (userAvatarData) { preview.src = userAvatarData; preview.style.display = 'block'; } else preview.style.display = 'none';
  const bgPreview = document.getElementById('configBgPreview'); if (chatBgData) { bgPreview.src = chatBgData; bgPreview.style.display = 'block'; } else bgPreview.style.display = 'none';
  renderMemoryList(); applyEmotionToUI(); document.getElementById('configOverlay').classList.add('show');
}

/* 渲染双池记忆列表 */
function renderMemoryList() {
  const coreList = document.getElementById('coreMemList');
  const normalList = document.getElementById('normalMemList');
  const coreCount = document.getElementById('coreMemCount');
  const normalCount = document.getElementById('normalMemCount');
  const m = state.memory;

  coreCount.textContent = m.coreFacts.length ? `（${m.coreFacts.length} 条）` : '';
  normalCount.textContent = `（${m.normalFacts.length} / ${NORMAL_MEM_MAX} 条）`;

  // 核心记忆
  coreList.innerHTML = '';
  if (!m.coreFacts.length) {
    coreList.innerHTML = '<div class="mem-empty">还没有永远不想忘的事</div>';
  } else {
    m.coreFacts.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'mem-item core';
      item.innerHTML = `<span class="txt"></span><span class="act down" title="降为普通">↓</span><span class="act del" title="删除">✕</span>`;
      item.querySelector('.txt').textContent = f;
      item.querySelector('.down').onclick = () => demoteMem(i);
      item.querySelector('.del').onclick = () => deleteCoreMem(i);
      coreList.appendChild(item);
    });
  }

  // 普通记忆
  normalList.innerHTML = '';
  if (!m.normalFacts.length) {
    normalList.innerHTML = '<div class="mem-empty">她的笔记本还是空的</div>';
  } else {
    m.normalFacts.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'mem-item';
      item.innerHTML = `<span class="txt"></span><span class="act up" title="升级为核心">★</span><span class="act del" title="删除">✕</span>`;
      item.querySelector('.txt').textContent = f;
      item.querySelector('.up').onclick = () => promoteMem(i);
      item.querySelector('.del').onclick = () => deleteNormalMem(i);
      normalList.appendChild(item);
    });
  }

  if (m.summary) {
    const tip = document.createElement('div');
    tip.style.cssText = 'font-size:11px;color:#aaa;margin-top:10px;';
    tip.textContent = '📝 早期对话已压缩成摘要（' + m.summary.length + ' 字）';
    normalList.appendChild(tip);
  }
}

function saveConfig() {
  const key = document.getElementById('apiKeyInput').value.trim(); if (!key) { showToast('API Key 不能为空'); return; }
  localStorage.setItem(KEY_API, key); localStorage.setItem(KEY_MODEL, document.getElementById('modelInput').value); localStorage.setItem(KEY_PROMPT, document.getElementById('promptInput').value.trim() || DEFAULT_PROMPT);
  document.getElementById('configOverlay').classList.remove('show');
  if (!state.messages.length) greet(); else showToast('设置已保存');
}
async function clearAll() {
  if (!confirm('清空所有聊天记录、她的记忆和心事？')) return;
  state = {
    messages: [], emotion: { name:'温柔', intensity:0.5 },
    memory: { coreFacts: [], normalFacts: [], summary: '', summarizedUpTo: 0 },
    proactive: { lastUserMsgAt:0, lastAiMsgAt:0, lastProactiveAt:0, proactiveCount:0, lastSeenAt:0 },
    thoughts: []
  };
  localStorage.removeItem(STORAGE_KEY); await idbDel('full_archive');
  document.getElementById('chatArea').innerHTML = ''; document.getElementById('configOverlay').classList.remove('show'); applyEmotionToUI(); greet();
}

/* =========================================================================
   十四、启动
   ========================================================================= */
const msgInput = document.getElementById('msgInput');
msgInput.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 100) + 'px'; });
msgInput.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
function updateClock() { const n = new Date(); document.getElementById('clock').textContent = n.getHours() + ':' + String(n.getMinutes()).padStart(2,'0'); }
updateClock(); setInterval(updateClock, 30000);

window.addEventListener('load', async () => {
  await loadStateDual();
  applyChatBg();
  if (state.messages.length) renderAll(); else applyEmotionToUI();
  if (!getApiKey()) setTimeout(openConfig, 400);
  else {
    const now = Date.now(); const sinceUser = now - state.proactive.lastUserMsgAt;
    if (state.messages.length && sinceUser > OPEN_THRESHOLD && !isQuietHours()) setTimeout(() => triggerProactive('open'), 2000);
    else if (!state.messages.length) greet();
  }
  startProactiveLoop();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { state.proactive.lastSeenAt = Date.now(); saveState(); }
    else { const now = Date.now(); const awayTime = now - (state.proactive.lastSeenAt || now); if (awayTime > RESUME_THRESHOLD && !isQuietHours() && getApiKey() && state.messages.length) setTimeout(() => triggerProactive('resume'), 1500); }
  });
});
window.addEventListener('beforeunload', saveState);
window.addEventListener('pagehide', saveState);
</script>
